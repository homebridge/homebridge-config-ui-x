  />

  <!-- middle wave -->
  <path
    d="M3,25 C6,27 9,23 12,25 C15,27 18,23 21,25 C24,27 27,23 30,25"
    class="air-line line2"
    stroke="#7f7f7f"
    fill="transparent"
    stroke-width="1.5"
    stroke-linecap="round"
  />

  <!-- bottom wave -->
  <path
    d="M3,30 C6,32 9,28 12,30 C15,32 18,28 21,30 C24,32 27,28 30,30"
    class="air-line line2"
    stroke="#7f7f7f"
    fill="transparent"
    stroke-width="1.5"
    stroke-linecap="round"
  />
