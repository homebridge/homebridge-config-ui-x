<div class="app-spinner-container" role="status" aria-live="polite" aria-busy="true">
  <span class="visually-hidden">{{ 'common.a11y.loading' | translate }}</span>
  <div class="animate_loader" aria-hidden="true">
    <svg
      xmlns="http://www.w3.org/2000/svg"
      xmlns:xlink="http://www.w3.org/1999/xlink"
      class="spinner-svg"
      width="200px"
      height="200px"
      viewBox="0 0 100 100"
      preserveAspectRatio="xMidYMid"
      focusable="false"
      aria-hidden="true"
    >
      <circle
        cx="50"
        cy="50"
        r="32"
        stroke-width="8"
        class="spinner_outer"
        stroke-dasharray="50.26548245743669 50.26548245743669"
        fill="none"
        stroke-linecap="round"
      />
      <circle
        cx="50"
        cy="50"
        r="23"
        stroke-width="8"
        stroke="#f8b26a"
        class="spinner_inner"
        stroke-dasharray="36.12831551628262 36.12831551628262"
        stroke-dashoffset="36.12831551628262"
        fill="none"
        stroke-linecap="round"
      />
    </svg>
  </div>
</div>
