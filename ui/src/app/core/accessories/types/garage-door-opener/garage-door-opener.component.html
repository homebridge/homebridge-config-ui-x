<div class="accessory-wrapper">
  <button
    type="button"
    class="accessory-box"
    [ngClass]="{
      'accessory-on': service.values.ObstructionDetected
        || [0, 2, 3, 4].includes(service.values.CurrentDoorState)
        || service.values.On
        || service.values.Active,
      'opening': service.values.CurrentDoorState === 2 && !service.values.ObstructionDetected,
      'open': service.values.CurrentDoorState === 0 && !service.values.ObstructionDetected,
      'closing': service.values.CurrentDoorState === 3 && !service.values.ObstructionDetected,
      'closed': service.values.CurrentDoorState === 1 && !service.values.ObstructionDetected,
      'stopped': service.values.CurrentDoorState === 4 && !service.values.ObstructionDetected,
      'obstructed': service.values.ObstructionDetected
    }"
    (click)="onActivate()"
    [attr.aria-label]="
      (service.customName || service.serviceName) + ', ' +
      (
        service.values?.ObstructionDetected
          ? ('accessories.control.obstructed' | translate)
          : ('CurrentDoorState' in service.values)
            ? (
                (service.values.CurrentDoorState === 0)
                  ? ('accessories.control.open' | translate)
                  : (service.values.CurrentDoorState === 1)
                    ? ('accessories.control.closed' | translate)
                    : (service.values.CurrentDoorState === 2)
                      ? ('accessories.control.opening' | translate)
                      : (service.values.CurrentDoorState === 3)
                        ? ('accessories.control.closing' | translate)
                        : (service.values.CurrentDoorState === 4)
                          ? ('accessories.control.stopped' | translate)
                          : ('accessories.control.closed' | translate)
              )
            : ((service.values?.On || service.values?.Active)
                ? ('accessories.control.open' | translate)
                : ('accessories.control.closed' | translate))
      )
    "
  >
    <div class="d-flex flex-column h-100" aria-hidden="true">
      <div class="accessory-svg">
        <!-- your SVG unchanged -->
      </div>

      <div class="accessory-label mt-auto">{{ service.customName || service.serviceName }}</div>

      <div>
        @if (service.values.ObstructionDetected) {
          <div class="accessory-label red-text">{{ 'accessories.control.obstructed' | translate }}</div>
        } @else if ('CurrentDoorState' in service.values) {
          @switch (service.values.CurrentDoorState) {
            @case (0) { <div class="accessory-label red-text">{{ 'accessories.control.open' | translate }}</div> }
            @case (1) { <div class="accessory-label grey-text">{{ 'accessories.control.closed' | translate }}</div> }
            @case (2) { <div class="accessory-label red-text">{{ 'accessories.control.opening' | translate }}...</div> }
            @case (3) { <div class="accessory-label red-text">{{ 'accessories.control.closing' | translate }}...</div> }
            @case (4) { <div class="accessory-label red-text">{{ 'accessories.control.stopped' | translate }}</div> }
          }
        } @else {
          @if (service.values.On || service.values.Active) {
            <div class="accessory-label red-text">{{ 'accessories.control.open' | translate }}</div>
          } @else {
            <div class="accessory-label grey-text">{{ 'accessories.control.closed' | translate }}</div>
          }
        }
      </div>
    </div>
  </button>

  <div class="visually-hidden" role="alert" aria-atomic="true">
    {{ alertAnnouncement }}
  </div>
</div>
