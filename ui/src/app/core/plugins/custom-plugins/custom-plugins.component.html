<div class="modal-content">
  <div class="modal-header">
    <h5 class="modal-title">{{ plugin.displayName || plugin.name }}</h5>
    <button
      type="button"
      class="btn-close"
      data-bs-dismiss="modal"
      [attr.aria-label]="'form.button_close' | translate"
      [disabled]="saveInProgress()"
      (click)="dismissModal()"
    ></button>
  </div>
  <div class="modal-body pb-0" style="min-height: 110px">
    @if (loading()) {
      <div class="text-center primary-text my-5 w-100">
        <i class="fa fa-circle-notch fa-spin" style="font-size: 75px"></i>
      </div>
    }

    <iframe
      #custompluginui
      width="100%"
      height="1px;"
      style="border: 0"
      sandbox="allow-same-origin allow-scripts allow-popups allow-popups-to-escape-sandbox allow-downloads allow-forms"
      [attr.title]="'plugins.button_settings' | translate"
      [attr.aria-label]="'plugins.button_settings' | translate"
    >
    </iframe>

    @if (uiLoaded() && pluginConfig.length && schema.singular && showSchemaForm()) {
      <div class="card card-body">
        <app-schema-form [configSchema]="schema" [(data)]="pluginConfig[0]" (isValid)="onIsValid($event)" />
      </div>
    }
    @if (formId()) {
      <div class="card card-body">
        <app-schema-form
          [configSchema]="formSchema()"
          [data]="formData()"
          (dataChange)="formData.set($event)"
          (dataChanged)="formUpdatedSubject.next($event)"
          (isValid)="formValidEvent($event)"
        />
        <div class="text-end custom-form-action-buttons">
          @if (formCancelButtonLabel()) {
            <button class="btn btn-elegant" type="button" (click)="formActionSubject.next('cancel')">
              {{ formCancelButtonLabel() }}
            </button>
          }
          @if (formSubmitButtonLabel()) {
            <button
              class="btn btn-primary"
              type="button"
              [disabled]="!formValid()"
              (click)="formActionSubject.next('submit')"
            >
              {{ formSubmitButtonLabel() }}
            </button>
          }
        </div>
      </div>
    }
    @if (pluginSpinner()) {
      <div class="loading-overlay text-center primary-text d-flex align-items-center justify-content-center">
        <i class="fa fa-circle-notch fa-spin" style="font-size: 75px"></i>
      </div>
    }
  </div>
  <div class="modal-footer justify-content-between">
    <div class="text-start">
      <button
        type="button"
        class="btn btn-elegant"
        data-bs-dismiss="modal"
        [disabled]="saveInProgress()"
        (click)="dismissModal()"
      >
        {{ 'form.button_close' | translate }}
      </button>
    </div>
    <div class="text-center"></div>
    <div class="text-end d-flex align-items-center justify-content-end">
      @if (!saveButtonDisabled()) {
        <i
          class="fa fa-xl me-2"
          container="modal"
          placement="top"
          triggers="hover"
          [class.fa-circle-check]="formIsValid()"
          [class.green-text]="formIsValid()"
          [class.fa-circle-exclamation]="!formIsValid()"
          [class.red-text]="strictValidation() && !formIsValid()"
          [class.orange-text]="!strictValidation() && !formIsValid()"
          [ngbTooltip]="
            (formIsValid()
              ? 'form.label_valid'
              : strictValidation()
                ? 'form.label_invalid_strict'
                : 'form.label_invalid'
            ) | translate
          "
          [openDelay]="150"
        ></i>
      }
      <button
        type="button"
        class="btn btn-primary"
        data-bs-dismiss="modal"
        [disabled]="saveInProgress() || saveButtonDisabled()"
        (click)="savePluginConfig(true)"
      >
        @if (!saveInProgress()) {
          {{ 'form.button_save' | translate }}
        }
        @if (saveInProgress()) {
          <i class="fas fa-circle-notch fa-spin"></i>
        }
      </button>
    </div>
  </div>
</div>
