<div class="modal-content" [class.terminal-light-theme]="isLightTerminalTheme">
  <div class="modal-header">
    <h5 class="modal-title">{{ plugin?.displayName || plugin?.name }}</h5>
    <button
      type="button"
      class="btn-close"
      data-bs-dismiss="modal"
      [attr.aria-label]="'form.button_close' | translate"
      [disabled]="midAction()"
      (click)="dismissModal()"
    ></button>
  </div>
  <div class="modal-body d-flex flex-row flex-grow-1 w-100 p-0">
    <div
      #pluginlogoutput
      class="w-100 plugin-log-output terminal align-self-end w-100 h-100 mb-0"
      [class.terminal-dark-bg]="!isLightTerminalTheme"
      [class.terminal-light-bg]="isLightTerminalTheme"
    ></div>
  </div>
  <div class="modal-footer justify-content-between">
    <div class="text-start">
      <button
        type="button"
        class="btn btn-elegant"
        data-bs-dismiss="modal"
        [attr.aria-label]="'form.button_close' | translate"
        [disabled]="midAction()"
        (click)="dismissModal()"
      >
        {{ 'form.button_close' | translate }}
      </button>
    </div>
    <div class="text-center"></div>
    <div class="text-end">
      <button
        type="button"
        class="btn btn-primary"
        container="modal"
        placement="top"
        triggers="hover"
        [attr.aria-label]="'logs.title_download_log_file' | translate"
        [ngbTooltip]="'logs.title_download_log_file' | translate"
        [openDelay]="150"
        [disabled]="midAction()"
        (click)="downloadLogFile()"
      >
        <i class="fas fa-download"></i>
      </button>
      @if (childBridges.length) {
        <button
          type="button"
          class="btn btn-danger ms-3"
          container="modal"
          placement="top"
          triggers="hover"
          [attr.aria-label]="
            (childBridges.length > 1 ? 'child_bridge.restart_plural' : 'child_bridge.restart') | translate
          "
          [ngbTooltip]="(childBridges.length > 1 ? 'child_bridge.restart_plural' : 'child_bridge.restart') | translate"
          [openDelay]="150"
          [disabled]="midAction()"
          (click)="restartChildBridges()"
        >
          <i class="fas fa-power-off"></i>
        </button>
      }
    </div>
  </div>
</div>
