<div
  class="m-header text-end"
  [attr.tabindex]="isMobile() ? '0' : '-1'"
  [attr.role]="isMobile() ? 'button' : null"
  [attr.aria-hidden]="isMobile() ? null : 'true'"
  [attr.aria-expanded]="isMobile() ? (isExpanded() ? 'true' : 'false') : null"
  [attr.aria-controls]="isMobile() ? 'sidebar' : null"
  [attr.aria-label]="isMobile() ? ('menu.sidebar.aria_menu' | translate) : null"
  (click)="toggleSidebar()"
  (keydown)="handleKeydown($event)"
>
  <span class="me-2 d-block d-lg-none m-header-label"></span>
  <a tabindex="-1" aria-hidden="true" [routerLink]="['/']">
    <img class="hb-logo-img" ngSrc="assets/homebridge-logo.svg" alt="" height="35" width="35" />
    <div class="hb-logo-text-mobile">Homebridge</div>
  </a>
  <div aria-hidden="true" class="hamburger-icon" [class.hamburger-icon-cross]="isExpanded()">
    <span></span>
    <span></span>
    <span></span>
    <span></span>
  </div>
</div>

<div
  class="sidebar"
  id="sidebar"
  [attr.role]="isMobile() ? null : 'navigation'"
  [attr.aria-label]="isMobile() ? null : ('menu.sidebar.aria_menu' | translate)"
  [class.expanded]="isExpanded()"
>
  <div class="header">
    <a tabindex="-1" aria-hidden="true" [routerLink]="['/']">
      <img class="hb-logo-img" ngSrc="assets/homebridge-logo.svg" alt="" height="35" width="35" />
      <div class="hb-logo-text">Homebridge</div>
    </a>
  </div>
  <div class="link-wrapper">
    <div class="link">
      <button
        #statusRla="routerLinkActive"
        type="button"
        class="link-row"
        routerLinkActive="active"
        [routerLink]="['/']"
        [routerLinkActiveOptions]="{ exact: true }"
        [attr.aria-label]="
          ('menu.label_status' | translate) + (statusRla.isActive ? `, ${('menu.current_page' | translate)}` : '')
        "
      >
        <div class="icon"><i aria-hidden="true" class="fas fa-house"></i></div>
        <div class="title">{{ 'menu.label_status' | translate }}</div>
      </button>
    </div>

    @if (rPiWasUnderVoltage() || rPiCurrentlyUnderVoltage()) {
      <div class="link">
        <button
          type="button"
          class="link-row"
          [attr.aria-label]="`${('rpi.throttled.undervoltage_title' | translate)} - ${('rpi.throttled.undervoltage_description' | translate)}`"
          (click)="openUnderVoltageModal()"
        >
          <div class="icon"><i aria-hidden="true" class="fas fa-bolt fa-beat yellow-text fa-beat-scale-lg"></i></div>
          <div class="title">{{ 'rpi.throttled.undervoltage_title' | translate }}</div>
        </button>
      </div>
    }

    <div class="link">
      <button
        #pluginsRla="routerLinkActive"
        type="button"
        class="link-row"
        routerLinkActive="active"
        [routerLink]="['/plugins']"
        [attr.aria-label]="
          ('menu.label_plugins' | translate) + (pluginsRla.isActive ? `, ${('menu.current_page' | translate)}` : '')
        "
      >
        <div class="icon"><i aria-hidden="true" class="fas fa-plug"></i></div>
        <div class="title">{{ 'menu.label_plugins' | translate }}</div>
      </button>
    </div>

    <div class="link">
      <button
        #accessoriesRla="routerLinkActive"
        type="button"
        class="link-row"
        routerLinkActive="active"
        [routerLink]="['/accessories']"
        [attr.aria-label]="
          ('menu.label_accessories' | translate) +
          (accessoriesRla.isActive ? `, ${('menu.current_page' | translate)}` : '')
        "
      >
        <div class="icon"><i aria-hidden="true" class="fas fa-lightbulb"></i></div>
        <div class="title">{{ 'menu.label_accessories' | translate }}</div>
      </button>
    </div>
    <div class="link">
      <button
        #smartAutomationsRla="routerLinkActive"
        type="button"
        class="link-row"
        routerLinkActive="active"
        [routerLink]="['/smart-automations']"
        [attr.aria-label]="`Smart Automation${smartAutomationsRla.isActive ? `, ${('menu.current_page' | translate)}` : ''}`"
        [attr.title]="'Smart Automation'"
      >
        <div class="icon"><i aria-hidden="true" class="fas fa-toggle-on"></i></div>
        <div class="title">Smart Automation</div>
      </button>
    </div>

    <div class="link">
      <button
        #logsRla="routerLinkActive"
        type="button"
        class="link-row"
        routerLinkActive="active"
        [routerLink]="['/logs']"
        [attr.aria-label]="
          ('menu.linux.label_logs' | translate) + (logsRla.isActive ? `, ${('menu.current_page' | translate)}` : '')
        "
      >
        <div class="icon"><i aria-hidden="true" class="fas fa-wave-square"></i></div>
        <div class="title">{{ 'menu.linux.label_logs' | translate }}</div>
      </button>
    </div>

    @if (enableTerminalAccess && isAdmin) {
      <div class="link">
        <button
          #terminalRla="routerLinkActive"
          type="button"
          class="link-row"
          routerLinkActive="active"
          [routerLink]="['/platform-tools/terminal']"
          [attr.aria-label]="
            ('menu.linux.label_terminal' | translate) +
            (terminalRla.isActive ? `, ${('menu.current_page' | translate)}` : '')
          "
        >
          <div class="icon"><i aria-hidden="true" class="fas fa-terminal"></i></div>
          <div class="title">{{ 'menu.linux.label_terminal' | translate }}</div>
        </button>
      </div>
    }
    @if (isAdmin) {
      <div class="link">
        <button
          #configRla="routerLinkActive"
          type="button"
          class="link-row"
          routerLinkActive="active"
          [routerLink]="['/config']"
          [attr.aria-label]="
            ('menu.config_json_editor' | translate) +
            (configRla.isActive ? `, ${('menu.current_page' | translate)}` : '')
          "
        >
          <div class="icon"><i aria-hidden="true" class="fas fa-code"></i></div>
          <div class="title">{{ 'menu.config_json_editor' | translate }}</div>
        </button>
      </div>
    }
    @if (isAdmin) {
      <div class="link">
        <button
          #settingsRla="routerLinkActive"
          type="button"
          class="link-row"
          routerLinkActive="active"
          [routerLink]="['/settings']"
          [attr.aria-label]="
            ('menu.label_settings' | translate) + (settingsRla.isActive ? `, ${('menu.current_page' | translate)}` : '')
          "
        >
          <div class="icon"><i aria-hidden="true" class="fas fa-cog"></i></div>
          <div class="title">{{ 'menu.label_settings' | translate }}</div>
        </button>
      </div>
    }

    <div class="link">
      <button
        #supportRla="routerLinkActive"
        type="button"
        class="link-row"
        routerLinkActive="active"
        [routerLink]="['/support']"
        [attr.aria-label]="
          ('support.title' | translate) + (supportRla.isActive ? `, ${('menu.current_page' | translate)}` : '')
        "
      >
        <div class="icon"><i aria-hidden="true" class="far fa-circle-question"></i></div>
        <div class="title">{{ 'support.title' | translate }}</div>
      </button>
    </div>

    @if (isAdmin) {
      <div class="link">
        <button
          #powerRla="routerLinkActive"
          type="button"
          class="link-row"
          routerLinkActive="active"
          [routerLink]="['/power-options']"
          [attr.aria-label]="
            ('menu.restart.title' | translate) + (powerRla.isActive ? `, ${('menu.current_page' | translate)}` : '')
          "
        >
          <div class="icon"><i aria-hidden="true" class="fas fa-power-off"></i></div>
          <div class="title">{{ 'menu.restart.title' | translate }}</div>
        </button>
      </div>
    }
    @if (isPwa) {
      <div class="link">
        <button type="button" class="link-row" [attr.aria-label]="'menu.reload' | translate" (click)="reloadPage()">
          <div class="icon"><i aria-hidden="true" class="fas fa-arrows-rotate"></i></div>
          <div class="title">{{ 'menu.reload' | translate }}</div>
        </button>
      </div>
    }
    @if (formAuth()) {
      <div class="link">
        <button type="button" class="link-row" [attr.aria-label]="'menu.tooltip_logout' | translate" (click)="logout()">
          <div class="icon"><i aria-hidden="true" class="fas fa-right-from-bracket"></i></div>
          <div class="title">{{ 'menu.tooltip_logout' | translate }}</div>
        </button>
      </div>
    }
  </div>
</div>
