<div class="modal-content">
  <div class="modal-header">
    <h5 class="modal-title">{{ 'status.widget.show_hide' | translate }}</h5>
    <button
      type="button"
      class="btn-close"
      [attr.aria-label]="'form.button_close' | translate"
      (click)="closeModal()"
    ></button>
  </div>

  <div class="modal-body">
    @if (availableWidgets.length) {
    <ul class="list-group list-group-box mb-0">
      <li class="list-group-item text-center grey-text small">
        <span [innerHTML]="'status.widget.account_1' | translate"></span><br />
        <span [innerHTML]="'status.widget.account_2' | translate"></span>
      </li>

      @for (widget of availableWidgets; track widget) {
      <li class="list-group-item d-flex justify-content-end align-items-center">
        <input
          type="checkbox"
          class="rendux-input"
          [(ngModel)]="widget.shown"
          (ngModelChange)="toggleWidget(widget, $event)"
          [attr.aria-label]="widget.name"
        />
      </li>
      }
    </ul>
    }
  </div>

  <div class="modal-footer justify-content-between">
    <div class="text-start">
      <button
        type="button"
        class="btn btn-elegant"
        (click)="closeModal()"
      >
        {{ 'form.button_close' | translate }}
      </button>
    </div>

    <div class="text-end">
      <button
        type="button"
        class="btn btn-danger"
        (click)="doResetLayout()"
      >
        {{ 'form.button_reset' | translate }}
      </button>
    </div>
  </div>
</div>
