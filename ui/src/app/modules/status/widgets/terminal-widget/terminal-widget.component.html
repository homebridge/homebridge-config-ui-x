<div
  #widgetcontainer
  class="flex-column d-flex align-items-stretch h-100 w-100"
  [ngStyle]="{ 'background-color': theme === 'dark' ? '#2b2b2b' : '' }"
>
  <div
    #terminaltitle
    [ngStyle]="{
      'color': theme === 'dark' ? '#ffffff' : '',
      'background-color': theme === 'dark' ? '#2b2b2b': '',
    }"
    class="drag-handler p-2"
    [ngClass]="{ 'widget-cursor': widget.draggable }"
  >
    <div style="display: flex; align-items: center; gap: 8px">
      <span aria-hidden="true">▶</span>
      <span>Homebridge {{ 'menu.docker.terminal' | translate }}</span>
    </div>

    <button
      type="button"
      class="visually-hidden-focusable"
      [attr.aria-expanded]="srExpanded"
      [attr.aria-controls]="contentId"
      (click)="toggleSrExpanded($event)"
    >
      Terminal
    </button>
  </div>

  <div
    [attr.id]="contentId"
    class="p-2"
    [attr.aria-hidden]="srExpanded ? null : 'true'"
    [attr.inert]="srExpanded ? null : ''"
  >
    <div #terminaloutput class="terminal gridster-item-content w-100 h-100" style="max-height: 100%"></div>
  </div>
</div>
