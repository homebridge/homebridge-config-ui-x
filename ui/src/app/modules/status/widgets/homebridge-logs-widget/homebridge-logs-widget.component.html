<div
  #widgetcontainer
  class="flex-column d-flex align-items-stretch h-100 w-100"
  [ngStyle]="{ 'background-color': theme === 'dark' ? '#2b2b2b' : '' }"
>
  <div
    #terminaltitle
    [ngStyle]="{
      'color': theme === 'dark' ? '#ffffff' : '',
      'background-color': theme === 'dark' ? '#2b2b2b': '',
    }"
    class="drag-handler p-2"
    [ngClass]="{ 'widget-cursor': widget.draggable }"
  >
    <button
      type="button"
      [attr.aria-expanded]="isExpanded"
      [attr.aria-controls]="contentId"
      (click)="toggleExpanded($event)"
      style="
        background: none;
        border: none;
        color: inherit;
        font: inherit;
        cursor: pointer;
        padding: 0;
        width: 100%;
        text-align: left;
        display: flex;
        align-items: center;
        gap: 8px;
      "
    >
      <span aria-hidden="true">{{ isExpanded ? '▼' : '▶' }}</span>
      <span>{{ 'status.widget.homebridge_logs' | translate }}</span>
    </button>
  </div>
  
  <div 
    [attr.id]="contentId"
    [ngStyle]="{'height.px': isExpanded ? terminalHeight : 0}" 
    [style.overflow]="isExpanded ? 'visible' : 'hidden'"
    [style.transition]="'height 0.3s ease-out'"
    class="p-2"
  >
    <div 
      #logoutput 
      class="terminal gridster-item-content w-100 h-100" 
      style="max-height: 100%"
      [attr.aria-hidden]="!isExpanded"
    ></div>
  </div>
</div>
