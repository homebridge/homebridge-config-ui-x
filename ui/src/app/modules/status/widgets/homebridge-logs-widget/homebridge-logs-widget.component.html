<div
  #widgetcontainer
  class="flex-column d-flex align-items-stretch h-100 w-100"
  [class.widget-container-dark]="theme() === 'dark'"
>
  <div #terminaltitle class="drag-handler p-2" [class.terminal-title-dark]="theme() === 'dark'">
    {{ 'status.widget.homebridge_logs' | translate }}
  </div>
  <div class="p-2" [style.height.px]="terminalHeight()">
    <div #logoutput class="terminal gridster-item-content w-100 h-100 terminal-max-height"></div>
  </div>
</div>
