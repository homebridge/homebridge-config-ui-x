<div class="flex-column d-flex align-items-stretch h-100 w-100 pb-3 overflow-auto no-scrollbars">
  <div class="drag-handler p-2" [ngClass]="{ 'widget-cursor': widget.draggable }">
    {{ 'child_bridge.bridges' | translate }}
  </div>

  <div
    class="d-flex flex-wrap w-100 mt-0 justify-content-start gridster-item-content overflow-auto no-scrollbars align-items-center"
  >
    <!-- =============================== -->
    <!-- Main Homebridge as one big button -->
    <!-- =============================== -->
    <button
      type="button"
      class="hb-status-item d-flex flex-row w-100 px-3 mt-2 mb-1 text-start"
      style="min-width: max(25%, 225px)"
      [attr.aria-label]="
        (homebridgeStatus.name || 'Homebridge') + ', ' +
        (
          isRestarting
            ? 'restarting'
            : (
                homebridgeStatus.status === 'down'
                  ? ('status.services.label_not_running' | translate)
                  : ('status.services.label_running' | translate)
              )
        ) +
        (
          isRestarting
            ? ''
            : ', restart'
        )
      "
      (click)="
        (!isRestarting && homebridgeStatus.status !== 'pending' && isAdmin) &&
        restartHomebridge()
      "
      [attr.aria-disabled]="
        isRestarting || homebridgeStatus.status === 'pending' || !isAdmin ? 'true' : null
      "
    >
      <!-- Status icon -->
      <div class="hb-status-icon d-flex align-items-center">
        <i
          class="fas fa-hap fa-sm"
          [ngClass]="{
            'green-text': homebridgeStatus.status === 'ok' && !isRestarting,
            'text-warning': homebridgeStatus.status === 'pending' || isRestarting,
            'red-text': homebridgeStatus.status === 'down' && !isRestarting
          }"
          aria-hidden="true"
        ></i>
      </div>

      <!-- Visible text -->
      <div class="align-self-center flex-child px-2">
        <span>{{ homebridgeStatus.name || 'Homebridge' }}</span>
        <span class="ms-1">
          {{ isRestarting ? 'restarting' : ( homebridgeStatus.status === 'down' ? ('status.services.label_not_running' |
          translate) : ('status.services.label_running' | translate) ) }}
        </span>
      </div>

      <!-- Right-side icons -->
      <div class="grey-text ms-auto d-flex align-items-center">
        @if (!isRestarting && homebridgeStatus.status !== 'pending' && isAdmin) {
        <i class="icon-button fas fa-power-off" aria-hidden="true"></i>
        } @if (isRestarting || homebridgeStatus.status === 'pending') {
        <i class="fas fa-spinner fa-pulse" aria-hidden="true"></i>
        }
      </div>
    </button>

    <!-- =============================== -->
    <!-- Child Bridges -->
    <!-- =============================== -->
    @for (bridge of childBridges; track bridge.username) {
    <button
      type="button"
      class="hb-status-item d-flex flex-row w-100 px-3 mt-2 mb-1 text-start"
      style="min-width: max(25%, 225px)"
      [attr.aria-label]="
        bridge.name + ', ' +
        (
          (bridge.restarting || isRestarting)
            ? 'restarting'
            : (
                bridge.status === 'down'
                  ? ('status.services.label_not_running' | translate)
                  : ('status.services.label_running' | translate)
              )
        ) +
        (
          (bridge.restarting || isRestarting)
            ? ''
            : ', restart'
        )
      "
      (click)="
        (!bridge.restarting && !isRestarting && bridge.status !== 'pending' && isAdmin) &&
        restartChildBridge(bridge)
      "
      [attr.aria-disabled]="
        bridge.restarting || isRestarting || bridge.status === 'pending' || !isAdmin
          ? 'true'
          : null
      "
    >
      <!-- Status icon -->
      <div class="hb-status-icon d-flex align-items-center">
        <i
          class="fas fa-hap fa-sm"
          [ngClass]="{
            'green-text': bridge.status === 'ok' && !bridge.restarting && !isRestarting,
            'text-warning': bridge.status === 'pending' || bridge.restarting || isRestarting,
            'red-text': bridge.status === 'down' && !bridge.restarting && !isRestarting
          }"
          aria-hidden="true"
        ></i>
      </div>

      <!-- Visible text -->
      <div class="align-self-center flex-child px-2">
        <span>{{ bridge.name }}</span>
        <span class="ms-1">
          {{ (bridge.restarting || isRestarting) ? 'restarting' : ( bridge.status === 'down' ?
          ('status.services.label_not_running' | translate) : ('status.services.label_running' | translate) ) }}
        </span>
      </div>

      <!-- Right-side icons -->
      <div class="grey-text ms-auto d-flex align-items-center">
        @if (!bridge.restarting && !isRestarting && bridge.status !== 'pending' && isAdmin) {
        <i class="icon-button fas fa-power-off" aria-hidden="true"></i>
        } @if (bridge.restarting || bridge.status === 'pending' || isRestarting) {
        <i class="fas fa-spinner fa-pulse" aria-hidden="true"></i>
        }
      </div>
    </button>
    }
  </div>

  <!-- ====================================== -->
  <!-- Screen-reader-only live regions        -->
  <!-- ====================================== -->

  <!-- Homebridge live region -->
  <span aria-live="polite" style="position: absolute; opacity: 0; pointer-events: none">
    {{ homebridgeLiveMessage }}
  </span>

  <!-- Child bridges live regions -->
  @for (bridge of childBridges; track bridge.username) {
  <span aria-live="polite" style="position: absolute; opacity: 0; pointer-events: none">
    {{ childBridgeLiveMessages[bridge.username] || childBridgeLiveMessages[bridge.name] }}
  </span>
  }
</div>
