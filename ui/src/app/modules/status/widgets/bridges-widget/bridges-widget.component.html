<div class="flex-column d-flex align-items-stretch h-100 w-100 pb-3 overflow-auto no-scrollbars">
  <span class="visually-hidden" role="status" aria-live="polite" aria-atomic="true">
    {{ homebridgeLiveMessage() }}
  </span>
  @for (bridge of childBridges(); track bridge.username) {
    <span class="visually-hidden" role="status" aria-live="polite" aria-atomic="true">
      {{ childBridgeLiveMessages()[bridge.username || bridge.name] }}
    </span>
  }
  <div class="drag-handler p-2" [class.widget-cursor]="widget().draggable">
    {{ 'child_bridge.bridges' | translate }}
  </div>
  <div
    class="d-flex flex-wrap w-100 mt-0 justify-content-start gridster-item-content overflow-auto no-scrollbars align-items-center"
  >
    <button
      type="button"
      class="hb-status-item hb-status-item-quarter hb-status-row d-flex flex-row w-100 px-3 mt-2 mb-1 text-start"
      [attr.aria-label]="mainBridgeAriaLabel()"
      [attr.aria-disabled]="homebridgeStatus()?.status === 'pending' || isRestarting() || !isAdmin ? 'true' : null"
      (click)="!(homebridgeStatus()?.status === 'pending' || isRestarting() || !isAdmin) && restartHomebridge()"
    >
      <div class="hb-status-icon d-flex align-items-center">
        <i
          class="fas fa-hap fa-sm"
          aria-hidden="true"
          container="body"
          placement="right"
          triggers="hover"
          [class.green-text]="!isMainHapDisabled() && homebridgeStatus()?.status === 'ok' && !isRestarting()"
          [class.text-warning]="!isMainHapDisabled() && (homebridgeStatus()?.status === 'pending' || isRestarting())"
          [class.red-text]="!isMainHapDisabled() && homebridgeStatus()?.status === 'down' && !isRestarting()"
          [class.grey-text]="isMainHapDisabled()"
          [class.opacity-muted]="isMainHapDisabled()"
          [openDelay]="150"
          [ngbTooltip]="mainHapTooltipKey() | translate"
        ></i>
        @if (isMatterSupported) {
          <i
            class="fas fa-matter fa-sm ms-2"
            aria-hidden="true"
            container="body"
            placement="right"
            triggers="hover"
            [class.green-text]="
              homebridgeStatus()?.matter?.enabled && homebridgeStatus()?.status === 'ok' && !isRestarting()
            "
            [class.text-warning]="
              homebridgeStatus()?.matter?.enabled && (homebridgeStatus()?.status === 'pending' || isRestarting())
            "
            [class.red-text]="
              homebridgeStatus()?.matter?.enabled && homebridgeStatus()?.status === 'down' && !isRestarting()
            "
            [class.grey-text]="!homebridgeStatus()?.matter?.enabled"
            [class.opacity-muted]="!homebridgeStatus()?.matter?.enabled"
            [openDelay]="150"
            [ngbTooltip]="
              (homebridgeStatus()?.matter?.enabled
                ? homebridgeStatus()?.status === 'down' && !isRestarting()
                  ? 'status.services.matter_not_running'
                  : 'status.services.matter_running'
                : 'status.services.matter_not_enabled'
              ) | translate
            "
          ></i>
        }
      </div>
      <div class="align-self-center flex-child px-2">{{ homebridgeStatus()?.name || 'Homebridge' }}</div>
      <div class="grey-text ms-auto d-flex align-items-center" aria-hidden="true">
        @if (homebridgeStatus()?.status !== 'pending' && !isRestarting() && isAdmin) {
          <i class="fas fa-power-off"></i>
        }
        @if (homebridgeStatus()?.status === 'pending' || isRestarting()) {
          <i class="fas fa-circle-notch fa-spin"></i>
        }
      </div>
    </button>
    @for (bridge of childBridges(); track bridge.username) {
      <button
        type="button"
        class="hb-status-item hb-status-item-quarter hb-status-row d-flex flex-row w-100 px-3 mt-2 mb-1 text-start"
        [attr.aria-label]="childBridgeAriaLabel(bridge)"
        [attr.aria-disabled]="
          bridge.status === 'pending' || bridge.restarting || isRestarting() || !isAdmin ? 'true' : null
        "
        (click)="
          !(bridge.status === 'pending' || bridge.restarting || isRestarting() || !isAdmin) &&
            restartChildBridge(bridge)
        "
      >
        <div class="hb-status-icon d-flex align-items-center">
          <i
            class="fas fa-hap fa-sm"
            aria-hidden="true"
            container="body"
            placement="right"
            triggers="hover"
            [class.green-text]="
              !isChildHapDisabled(bridge) && bridge.status === 'ok' && !bridge.restarting && !isRestarting()
            "
            [class.text-warning]="
              !isChildHapDisabled(bridge) && (bridge.status === 'pending' || bridge.restarting || isRestarting())
            "
            [class.red-text]="
              !isChildHapDisabled(bridge) && bridge.status === 'down' && !bridge.restarting && !isRestarting()
            "
            [class.grey-text]="isChildHapDisabled(bridge)"
            [class.opacity-muted]="isChildHapDisabled(bridge)"
            [openDelay]="150"
            [ngbTooltip]="childHapTooltipKey(bridge) | translate"
          ></i>
          @if (isMatterSupported) {
            <i
              class="fas fa-matter fa-sm ms-2"
              aria-hidden="true"
              container="body"
              placement="right"
              triggers="hover"
              [class.green-text]="
                bridge.matterConfig && bridge.status === 'ok' && !bridge.restarting && !isRestarting()
              "
              [class.text-warning]="
                bridge.matterConfig && (bridge.status === 'pending' || bridge.restarting || isRestarting())
              "
              [class.red-text]="
                bridge.matterConfig && bridge.status === 'down' && !bridge.restarting && !isRestarting()
              "
              [class.grey-text]="!bridge.matterConfig"
              [class.opacity-muted]="!bridge.matterConfig"
              [openDelay]="150"
              [ngbTooltip]="
                (bridge.matterConfig
                  ? bridge.status === 'down' && !bridge.restarting && !isRestarting()
                    ? 'status.services.matter_not_running'
                    : 'status.services.matter_running'
                  : 'status.services.matter_not_enabled'
                ) | translate
              "
            ></i>
          }
        </div>
        <div class="align-self-center flex-child px-2">{{ bridge.name }}</div>
        <div class="grey-text ms-auto d-flex align-items-center" aria-hidden="true">
          @if (bridge.status !== 'pending' && !bridge.restarting && !isRestarting() && isAdmin) {
            <i class="fas fa-power-off"></i>
          }
          @if (bridge.status === 'pending' || bridge.restarting || isRestarting()) {
            <i class="fas fa-circle-notch fa-spin"></i>
          }
        </div>
      </button>
    }
  </div>
</div>
