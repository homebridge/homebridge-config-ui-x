<div class="modal-header">
  <h5 class="modal-title">
    {{ 'smart_automation.settings.title' | translate }}
  </h5>
  <button
    type="button"
    class="btn-close"
    [attr.aria-label]="'form.button_close' | translate"
    (click)="dismiss()"
  ></button>
</div>
<div class="modal-body">
  <div class="form-check form-switch">
    <input id="smart-automation-debug" type="checkbox" class="form-check-input" [(ngModel)]="debugEnabled" />
    <label class="form-check-label" for="smart-automation-debug">
      {{ 'smart_automation.settings.debug' | translate }}
      <small class="text-muted d-block">{{ 'smart_automation.settings.debug_help' | translate }}</small>
    </label>
  </div>
</div>
<div class="modal-footer">
  <button type="button" class="btn btn-elegant" (click)="dismiss()">
    {{ 'form.button_cancel' | translate }}
  </button>
  <button type="button" class="btn btn-primary" (click)="save()">
    {{ 'form.button_save' | translate }}
  </button>
</div>
