<div class="smart-automation-page">
  <div class="smart-automation-hero card flex-row mb-4">
    <div class="smart-automation-hero-icon primary-text" aria-hidden="true">
      <i class="fas fa-wand-magic-sparkles"></i>
    </div>
    <div class="flex-grow-1">
      <h3 class="primary-text mb-1">
        {{ 'smart_automation.title' | translate }}
      </h3>
      <p class="grey-text mb-0">
        {{ 'smart_automation.subtitle' | translate }}
      </p>
    </div>
    <div class="automation-count primary-text">
      <strong>{{ smartAutomations().length }}</strong>
      <span class="grey-text">
        {{
          (smartAutomations().length === 1 ? 'smart_automation.unit.automation' : 'smart_automation.unit.automations')
            | translate
        }}
      </span>
    </div>
    @if (isAdmin) {
      <app-smart-automation-menu
        [bridgeUsername]="childBridgeUsername()"
        [debugEnabled]="debugEnabled()"
        [disabled]="pluginDisabled()"
        (debugChange)="setDebugLogging($event)"
        (disabledChange)="pluginDisabled.set($event)"
      />
    }
  </div>

  <div class="row g-3 align-items-start">
    <div class="col-xl-4 col-lg-5">
      <app-smart-automation-list
        [automations]="smartAutomations()"
        [loading]="automationsLoading()"
        (setEnabled)="setSmartAutomationEnabled($event.automation, $event.enabled)"
        (edit)="editSmartAutomation($event)"
        (delete)="deleteSmartAutomation($event)"
      />
    </div>
    <div class="col-xl-8 col-lg-7">
      <app-smart-automation-form
        [draft]="smartAutomationDraft"
        [rooms]="rooms"
        [selectedLightUniqueIds]="selectedLightUniqueIds()"
        [selectedTargetUniqueId]="selectedTargetUniqueId()"
        (automationTypeChange)="onAutomationTypeChange($event)"
        (lightSelectionChange)="toggleLightSelection($event.uniqueId, $event.selected, $event.single, $event.target)"
        (cancelEdit)="closeSmartAutomationEditor()"
        (save)="saveSmartAutomation()"
      />
    </div>
  </div>
</div>
