<div class="modal-content">
  <form novalidate (ngSubmit)="onSubmit(form)" [formGroup]="form">
    <div class="modal-header">
      <h5 class="modal-title">{{ 'users.title_edit_user' | translate }}</h5>
      <button
        type="button"
        class="btn-close"
        data-bs-dismiss="modal"
        [attr.aria-label]="'form.button_close' | translate"
        (click)="dismissModal()"
      ></button>
    </div>
    <div class="modal-body">
      <div class="text-center mb-3">
        <i class="fas fa-user-pen primary-text" style="font-size: 75px"></i>
      </div>
      <ul class="list-group list-group-box mb-0" [style.opacity]="deleteMode() ? '0.25' : '1'">
        <li class="list-group-item d-flex flex-column flex-md-row align-items-center">
          <label for="form-username" class="mb-2 mb-md-0 w-100 w-md-50">
            {{ 'users.label_username' | translate }}<app-required-indicator />
          </label>
          <div class="text-start text-md-end w-100 w-md-50">
            <input
              formControlName="username"
              type="text"
              id="form-username"
              autocomplete="off"
              autocapitalize="none"
              class="form-control custom-input"
              [class.is-invalid]="form.controls.username.touched && form.controls.username.invalid"
              [attr.aria-label]="'users.label_username' | translate"
            />
          </div>
        </li>
        <li class="list-group-item d-flex flex-column flex-md-row align-items-center">
          <label for="form-name" class="mb-2 mb-md-0 w-100 w-md-50">
            {{ 'users.label_full_name' | translate }}<app-required-indicator />
          </label>
          <div class="text-start text-md-end w-100 w-md-50">
            <input
              formControlName="name"
              type="text"
              id="form-name"
              autocomplete="name"
              class="form-control custom-input"
              [class.is-invalid]="form.controls.name.touched && form.controls.name.invalid"
              [attr.aria-label]="'users.label_full_name' | translate"
            />
          </div>
        </li>
        <li class="list-group-item d-flex flex-column flex-md-row align-items-center">
          <label for="form-pass" class="mb-2 mb-md-0 w-100 w-md-50">
            {{ 'users.label_new_password' | translate }}@if (form.controls.password.value) {<app-required-indicator />}
          </label>
          <div class="text-start text-md-end w-100 w-md-50">
            <input
              formControlName="password"
              type="password"
              autocomplete="new-password"
              id="form-pass"
              class="form-control custom-input"
              [class.is-invalid]="form.controls.password.touched && form.controls.password.invalid"
              [attr.aria-label]="'users.label_new_password' | translate"
            />
          </div>
        </li>
        @if (form.controls.password.value) {
        <li class="list-group-item d-flex flex-column flex-md-row align-items-center">
          <label for="form-pass-confirm" class="mb-2 mb-md-0 w-100 w-md-50">
            {{ 'users.label_confirm_password' | translate }}<app-required-indicator />
          </label>
          <div class="text-start text-md-end w-100 w-md-50">
            <input
              formControlName="passwordConfirm"
              type="password"
              autocomplete="new-password"
              id="form-pass-confirm"
              class="form-control custom-input"
              [class.is-invalid]="form.controls.passwordConfirm.touched && form.controls.passwordConfirm.invalid"
              [attr.aria-label]="'users.label_confirm_password' | translate"
            />
          </div>
        </li>
        }
        <li class="list-group-item d-flex justify-content-between align-items-center flex-row pb-2">
          <span class="text-start"> {{ 'users.label_admin_user' | translate }}<app-required-indicator /> </span>
          <div class="text-end grey-text d-flex align-items-center">
            <input
              type="checkbox"
              class="rendux-input"
              formControlName="admin"
              id="isAdmin"
              [attr.aria-label]="'users.label_admin_user' | translate"
            />
            <label for="isAdmin" class="rendux-label ms-3"></label>
          </div>
        </li>
      </ul>
      @if (deleteMode()) {
      <div class="alert alert-warning mt-3 mb-0">
        <div class="text-center">{{ 'common.phrases.are_you_sure' | translate }}</div>
      </div>
      }
    </div>
    <div class="modal-footer justify-content-between">
      <div class="text-start">
        <button type="button" class="btn btn-elegant" data-bs-dismiss="modal" (click)="dismissModal()">
          {{ 'form.button_close' | translate }}
        </button>
      </div>
      <div class="text-center"></div>
      <div class="text-end">
        <button
          type="button"
          class="btn btn-elegant me-2"
          (click)="toggleDeleteMode($event)"
          [disabled]="!canDelete()"
          [attr.aria-label]="'users.button_delete_user' | translate"
        >
          <i [class]="deleteMode() ? 'fas fa-undo' : 'fas fa-trash'"></i>
        </button>
        <button
          type="submit"
          class="btn"
          [class]="deleteMode() ? 'btn-danger' : 'btn-primary'"
          [disabled]="!deleteMode() && (!form.valid || isFormUnchanged())"
        >
          {{ (deleteMode() ? 'form.button_delete' : 'form.button_save') | translate }}
        </button>
      </div>
    </div>
  </form>
</div>
